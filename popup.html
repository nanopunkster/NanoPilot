<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Nano Pilot</h1>

  <label>Provider<select data-key="provider" id="provider"></select></label>

  <fieldset data-provider="claude">
    <label>Claude API key<input type="password" data-key="claudeKey" placeholder="sk-ant-..."></label>
    <label>Claude model<input data-key="claudeModel"></label>
  </fieldset>

  <fieldset data-provider="groq">
    <label>Groq API key<input type="password" data-key="groqKey" placeholder="gsk_..."></label>
    <label>Groq model<input data-key="groqModel"></label>
    <small>Web research needs a GPT-OSS model, e.g. openai/gpt-oss-120b</small>
  </fieldset>

  <fieldset data-provider="openai">
    <label>OpenAI API key<input type="password" data-key="openaiKey" placeholder="sk-..."></label>
    <label>OpenAI model<input data-key="openaiModel"></label>
    <small>Web search confirmed on gpt-5.4. Other models may work</small>
  </fieldset>

  <label>Default tone<select data-key="tone" id="tone"></select></label>

  <label>Web search (default for each post)<select data-key="searchMode" id="searchMode"></select></label>

  <div class="nums">
    <label>Max searches<input type="number" data-key="maxSearches"></label>
    <label>Replies<input type="number" data-key="replyCount"></label>
    <label>Max chars<input type="number" data-key="maxChars"></label>
  </div>

  <label>Your voice (how you sound, not what you talk about)<textarea data-key="persona" rows="4"></textarea></label>
  <button id="resetVoice" class="ghost small">Reset voice</button>

  <div class="btns">
    <button id="save">Save</button>
    <button id="test" class="ghost">Test connection</button>
  </div>
  <p id="status"></p>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
